name: Build VPM Listing

# Regenerates the VPM listing whenever a release changes, and on demand.
#
# The `release` trigger alone is not enough: our releases are created by the "Build
# Release" workflow using the default GITHUB_TOKEN, and GitHub deliberately does NOT let
# events raised by GITHUB_TOKEN trigger further workflow runs (anti-recursion). So a
# tag-driven release would publish but the listing would never rebuild, leaving VCC one
# version behind. The `workflow_run` trigger closes that gap: when "Build Release"
# finishes, this runs and picks up the new version. (The plain `release` trigger still
# covers manual releases created in the GitHub UI.)
on:
  workflow_run:
    workflows: ["Build Release"]
    types: [completed]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build listing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "Website~/build_listing.py" --repo "${{ github.repository }}" --out dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
