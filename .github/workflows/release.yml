name: Build Release

# Publishing is manual on purpose: pushing a tag like "1.4.1" is what creates a release.
on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  PACKAGE_NAME: com.kawaiistudio.ksunitytools
  # 3.6.0: the Kawaii Studio Link is its own package (Link~ in the repo, no VRChat SDK dependency, so world projects
  # can have it). Every release carries it too; its version comes from Link~/package.json and only changes when it does.
  LINK_NAME: com.kawaiistudio.link

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
          LINK_VERSION=$(python -c "import json;print(json.load(open('Link~/package.json'))['version'])")
          echo "link_version=$LINK_VERSION" >> "$GITHUB_OUTPUT"
          echo "Link package version: $LINK_VERSION"

      - name: Verify the Link's version constant matches Link~/package.json
        run: |
          if ! grep -q "public const string Current = \"${{ steps.version.outputs.link_version }}\";" "Link~/Editor/KawaiiStudioLinkPaths.cs"; then
            echo "::error::KawaiiStudioLinkVersion.Current does not match Link~/package.json (${{ steps.version.outputs.link_version }})."
            exit 1
          fi

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag '$TAG' does not match package.json version '${{ steps.version.outputs.version }}'."
            exit 1
          fi

      # The package root is the repository root, so everything except repo-only
      # metadata goes into the zip that VCC / UPM will download.
      # Documentation~ is excluded on purpose: the README points at absolute GitHub
      # URLs, so shipping those 14 MB of screenshots to every user buys nothing.
      - name: Build package zip
        run: |
          mkdir -p build
          zip -r "build/${PACKAGE_NAME}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" "build/*" "Website~/*" "Documentation~/*" "Link~/*" "*.md.meta"
          ls -la build/

      # The Link package: Link~'s content at the zip root (what VCC extracts into Packages/com.kawaiistudio.link),
      # and its manifest attached as "<name>.package.json" so the listing builder finds both packages of a release.
      - name: Build Link package zip
        run: |
          (cd "Link~" && zip -r "../build/${LINK_NAME}-${{ steps.version.outputs.link_version }}.zip" . -x "*.md.meta")
          cp "Link~/package.json" "build/${LINK_NAME}.package.json"
          ls -la build/

      # The .unitypackage is the one-click path for users who don't use VCC/UPM: import it
      # and everything lands under Assets/Kawaii Studio with its assembly definitions, so
      # the VRC tools stay gated behind VRC_SDK_VRCSDK3 and nothing else fails to compile.
      # It used to be built by hand from an older layout (no .asmdef, Editor/Tools/VRC
      # flattened), which is exactly why 3.0.0 shipped broken. Generated here now so it can
      # never drift from the repo again.
      - name: Build .unitypackage
        run: |
          python .github/build_unitypackage.py "build/KSUnityTools.unitypackage"
          ls -la build/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            build/${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version }}.zip
            build/KSUnityTools.unitypackage
            package.json
            build/${{ env.LINK_NAME }}-${{ steps.version.outputs.link_version }}.zip
            build/${{ env.LINK_NAME }}.package.json
